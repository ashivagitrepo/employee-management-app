trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.13'

steps:

# ============================================================
# 1. Use Python
# ============================================================

- task: UsePythonVersion@0
  displayName: 'Use Python $(pythonVersion)'
  inputs:
    versionSpec: '$(pythonVersion)'


# ============================================================
# 2. Install Python dependencies
# ============================================================

- script: |
    python --version
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install dependencies'


# ============================================================
# 3. Application syntax test
# ============================================================

- script: |
    python -m py_compile app.py
    echo "Application syntax test passed."
  displayName: 'Run application test'


# ============================================================
# 4. Install SonarScanner CLI
# ============================================================

- script: |
    curl -sSLo sonar-scanner.zip \
      https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip

    unzip -q sonar-scanner.zip

    mv sonar-scanner-8.1.0.6389-linux-x64 $(Agent.TempDirectory)/sonar-scanner

    $(Agent.TempDirectory)/sonar-scanner/bin/sonar-scanner --version
  displayName: 'Install SonarScanner CLI'


# ============================================================
# 5. SonarQube analysis
# ============================================================

- script: |
    export SONAR_HOST_URL="http://20.124.249.106:9000"

    $(Agent.TempDirectory)/sonar-scanner/bin/sonar-scanner \
      -Dsonar.host.url="$SONAR_HOST_URL" \
      -Dsonar.token="$(SONAR_TOKEN)" \
      -Dsonar.projectKey="Employee-Management" \
      -Dsonar.projectName="Employee-Management" \
      -Dsonar.sources="." \
      -Dsonar.exclusions="venv/**,**/__pycache__/**"
  displayName: 'Run SonarQube Analysis'
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))


# ============================================================
# 6. Install Trivy
# ============================================================

- script: |
    curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $(Agent.TempDirectory)/trivy

    $(Agent.TempDirectory)/trivy/trivy --version
  displayName: 'Install Trivy'


# ============================================================
# 7. Trivy filesystem security scan
# ============================================================

- script: |
    $(Agent.TempDirectory)/trivy/trivy filesystem \
      --scanners vuln,misconfig,secret \
      --severity HIGH,CRITICAL \
      --format table \
      --exit-code 0 \
      .
  displayName: 'Run Trivy Security Scan'


# ============================================================
# 8. Build Docker image
# ============================================================

- script: |
    docker build \
      -t employee-management:$(Build.BuildId) \
      .

    docker tag \
      employee-management:$(Build.BuildId) \
      dockerymal/employee-management:$(Build.BuildId)

    docker images
  displayName: 'Build Docker Image'


# ============================================================
# 9. Trivy Docker image security scan
# ============================================================

- script: |
    $(Agent.TempDirectory)/trivy/trivy image \
      --scanners vuln,misconfig,secret \
      --severity HIGH,CRITICAL \
      --format table \
      --exit-code 0 \
      employee-management:$(Build.BuildId)
  displayName: 'Scan Docker Image with Trivy'


# ============================================================
# 10. Push Docker image to Docker Hub
# ============================================================

- task: Docker@2
  displayName: 'Push Docker Image to Docker Hub'
  inputs:
    command: 'push'
    repository: 'dockerymal/employee-management'
    containerRegistry: 'dockerhub-employee-management'
    tags: |
      $(Build.BuildId)


# ============================================================
# 11. Deploy exact Docker image to DEV
# ============================================================

- task: SSH@0
  displayName: 'Deploy to DEV'
  inputs:
    sshEndpoint: 'azure-vm-dev-ssh'
    runOptions: 'commands'
    commands: |
      echo "Deploying Employee Management Build $(Build.BuildId) to DEV"

      docker pull dockerymal/employee-management:$(Build.BuildId)

      docker stop employee-management-dev || true

      docker rm employee-management-dev || true

      docker run -d \
        --name employee-management-dev \
        -p 5001:5000 \
        --restart unless-stopped \
        dockerymal/employee-management:$(Build.BuildId)

      echo "DEV deployment completed."

      docker ps
