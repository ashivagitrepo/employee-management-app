trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  pythonVersion: '3.13'

stages:

- stage: Build
  displayName: Build and Security
  jobs:
  - job: BuildAndScan
    displayName: Build, SonarQube, Trivy and Docker
    steps:

    - task: UsePythonVersion@0
      displayName: Use Python
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python --version
        python -m pip install --upgrade pip
        pip install -r requirements.txt
      displayName: Install dependencies

    - script: |
        python -m py_compile app.py
        echo "Application syntax test passed."
      displayName: Run application test

    - script: |
        curl -sSLo sonar-scanner.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.1.0.6389-linux-x64.zip
        unzip -q sonar-scanner.zip
        mv sonar-scanner-8.1.0.6389-linux-x64 $(Agent.TempDirectory)/sonar-scanner
        $(Agent.TempDirectory)/sonar-scanner/bin/sonar-scanner --version
      displayName: Install SonarScanner

    - script: |
        export SONAR_HOST_URL="http://20.124.249.106:9000"
        $(Agent.TempDirectory)/sonar-scanner/bin/sonar-scanner \
          -Dsonar.host.url="$SONAR_HOST_URL" \
          -Dsonar.token="$(SONAR_TOKEN)" \
          -Dsonar.projectKey="Employee-Management" \
          -Dsonar.projectName="Employee-Management" \
          -Dsonar.sources="." \
          -Dsonar.exclusions="venv/**,**/__pycache__/**"
      displayName: Run SonarQube Analysis
      condition: "and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))"

    - script: |
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b $(Agent.TempDirectory)/trivy
        $(Agent.TempDirectory)/trivy/trivy --version
      displayName: Install Trivy

    - script: |
        $(Agent.TempDirectory)/trivy/trivy filesystem \
          --scanners vuln,misconfig,secret \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 0 .
      displayName: Run Trivy Security Scan

    - script: |
        docker build -t employee-management:$(Build.BuildId) .
        docker tag employee-management:$(Build.BuildId) dockerymal/employee-management:$(Build.BuildId)
        docker images
      displayName: Build Docker Image

    - script: |
        $(Agent.TempDirectory)/trivy/trivy image \
          --scanners vuln,misconfig,secret \
          --severity HIGH,CRITICAL \
          --format table \
          --exit-code 0 \
          employee-management:$(Build.BuildId)
      displayName: Scan Docker Image with Trivy

    - task: Docker@2
      displayName: Push Docker Image to Docker Hub
      inputs:
        command: push
        repository: dockerymal/employee-management
        containerRegistry: dockerhub-employee-management
        tags: |
          $(Build.BuildId)


- stage: DEV
  displayName: Deploy to DEV
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: DeployDEV
    displayName: Deploy Employee Management to DEV
    steps:

    - task: SSH@0
      displayName: Deploy to DEV
      inputs:
        sshEndpoint: azure-vm-dev-ssh
        runOptions: commands
        commands: |
          echo "Deploying Employee Management Build $(Build.BuildId) to DEV"
          docker pull dockerymal/employee-management:$(Build.BuildId)
          docker stop employee-management-dev || true
          docker rm employee-management-dev || true
          docker run -d --name employee-management-dev -p 5001:5000 --restart unless-stopped dockerymal/employee-management:$(Build.BuildId)
          echo "DEV deployment completed."
          docker ps --filter "name=employee-management-dev"


- stage: QA
  displayName: Deploy to QA
  dependsOn: DEV
  condition: succeeded()

  jobs:
  - job: DeployQA
    displayName: Deploy Employee Management to QA
    steps:

    - task: SSH@0
      displayName: Deploy to QA
      inputs:
        sshEndpoint: azure-vm-dev-ssh
        runOptions: commands
        commands: |
          echo "Deploying Employee Management Build $(Build.BuildId) to QA"
          docker pull dockerymal/employee-management:$(Build.BuildId)
          docker stop employee-management-qa || true
          docker rm employee-management-qa || true
          docker run -d --name employee-management-qa -p 5002:5000 --restart unless-stopped dockerymal/employee-management:$(Build.BuildId)
          echo "QA deployment completed."
          docker ps --filter "name=employee-management-qa"


- stage: PROD
  displayName: Deploy to PROD
  dependsOn: QA
  condition: succeeded()

  jobs:
  - deployment: DeployPROD
    displayName: Deploy Employee Management to PROD
    environment: PROD

    strategy:
      runOnce:
        deploy:
          steps:

          - task: SSH@0
            displayName: Deploy to PROD
            inputs:
              sshEndpoint: azure-vm-dev-ssh
              runOptions: commands
              commands: |
                echo "Deploying Employee Management Build $(Build.BuildId) to PROD"
                docker pull dockerymal/employee-management:$(Build.BuildId)
                docker rm -f employee-management-prod 2>/dev/null || true
                docker run -d --name employee-management-prod -p 5003:5000 --restart unless-stopped dockerymal/employee-management:$(Build.BuildId)
                echo "PROD deployment completed."
                docker ps --filter "name=employee-management-prod"