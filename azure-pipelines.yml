                  -l app=employee-management


# ============================================================
# PROD
# ============================================================

- stage: PROD
  displayName: Deploy to PROD
  dependsOn: QA
  condition: succeeded()

  jobs:

  - deployment: DeployPROD
    displayName: Deploy Employee Management to AKS PROD

    # IMPORTANT:
    # Keep this environment.
    # Your PROD approval/check is attached to this environment.

    environment: PROD

    strategy:
      runOnce:
        deploy:

          steps:

          - task: AzureCLI@2
            displayName: Deploy to AKS - PROD
            inputs:
              azureSubscription: azure-aks-wif
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |

                echo "Getting AKS credentials..."

                az aks get-credentials \
                  --resource-group rg-aks-devops-lab \
                  --name aks-devops-lab \
                  --overwrite-existing

                echo "Deploying Build $(Build.BuildId) to AKS PROD..."

                kubectl set image \
                  deployment/employee-management \
                  employee-management=acrdevopsshiva2026.azurecr.io/employee-management:$(Build.BuildId)

                echo "Waiting for rollout..."

                kubectl rollout status \
                  deployment/employee-management \
                  --timeout=180s

                echo "Deployment status:"

