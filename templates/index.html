<!DOCTYPE html>
<html>
<head>
    <title>Employee Management</title>
</head>
<body>

    <h1>Employee Management System</h1>

    <a href="/add">Add Employee</a>

    <h2>Employees</h2>

    <table border="1" cellpadding="10">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
        </tr>

        {% for employee in employees %}
        <tr>
            <td>{{ employee.id }}</td>
            <td>{{ employee.name }}</td>
            <td>{{ employee.role }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
