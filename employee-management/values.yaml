replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/gcp-kubernetes-by-shiva-akula/shiva-devops-repo/employee-management
  pullPolicy: IfNotPresent
  tag: latest

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

serviceAccount:
  create: false
  name: ""

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
